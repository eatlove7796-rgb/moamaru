<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>모아마루 - 작은 실천, 큰 뜻</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="모아마루">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    .day-check-btn {
      width: 29px !important;
      height: 29px !important;
      min-width: 29px !important;
      min-height: 29px !important;
      aspect-ratio: 1 / 1 !important;
    }
    @media (min-width: 640px) {
      .day-check-btn {
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        min-height: 36px !important;
      }
    }
    .touch-bounce:active { transform: scale(0.88); }
    html, body {
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-xl mx-auto px-3 h-12 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-xs">
          <i class="ph ph-mountains text-base font-bold"></i>
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-slate-900 tracking-tight leading-none">모아마루</h1>
          <span class="text-[9px] text-indigo-600 font-semibold leading-none">작은 실천, 큰 뜻</span>
        </div>
      </div>

      <div class="flex items-center space-x-1.5">
        <div class="bg-slate-100 p-0.5 rounded-lg flex items-center text-[11px] font-medium">
          <button id="tabWeeklyBtn" class="px-2 py-1 rounded bg-white text-indigo-600 font-bold shadow-2xs">체크</button>
          <button id="tabSheetBtn" class="px-2 py-1 rounded text-slate-600 hover:text-slate-900">기록표</button>
        </div>
        <button id="exportCsvBtn" class="p-1.5 rounded-lg bg-white border border-slate-200 text-emerald-600 hover:bg-slate-50" title="CSV">
          <i class="ph ph-file-csv text-base font-bold"></i>
        </button>
        <button id="openAddRoutineModalBtn" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold text-xs flex items-center shadow-xs">
          <i class="ph ph-plus font-bold mr-0.5"></i>추가
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-xl mx-auto w-full px-2.5 py-2.5 space-y-2.5">
    
    <div id="weeklyTrackerSection" class="space-y-2.5">
      <div class="bg-white px-3 py-2 rounded-xl border border-slate-200/80 flex items-center justify-between">
        <div class="flex items-center space-x-1">
          <button id="prevWeekBtn" class="w-7 h-7 rounded border border-slate-200 flex items-center justify-center text-slate-600">
            <i class="ph ph-caret-left text-xs font-bold"></i>
          </button>
          <div class="px-1 text-left">
            <span class="text-[9px] font-bold text-slate-400 block leading-none" id="currentMonthBadge">2026.09</span>
            <h2 class="text-xs sm:text-sm font-bold text-slate-800 leading-tight" id="weekRangeDisplay">9.15(월) - 9.21(일)</h2>
          </div>
          <button id="nextWeekBtn" class="w-7 h-7 rounded border border-slate-200 flex items-center justify-center text-slate-600">
            <i class="ph ph-caret-right text-xs font-bold"></i>
          </button>
          <button id="todayWeekBtn" class="px-2 py-1 text-[10px] font-semibold bg-slate-100 text-slate-700 rounded ml-1">이번주</button>
        </div>

        <div class="bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-lg text-right">
          <span class="text-[9px] text-indigo-600 font-bold block leading-none">이번주 달성</span>
          <div class="flex items-baseline space-x-1 justify-end">
            <span class="text-xs sm:text-sm font-extrabold text-indigo-700 font-mono" id="weeklyRateStat">0%</span>
            <span class="text-[9px] text-indigo-400 font-mono" id="weeklyFractionStat">(0/49)</span>
          </div>
        </div>
      </div>

      <div id="encouragementBanner" class="px-3 py-2 rounded-xl border flex items-center justify-between gap-1.5 bg-gradient-to-r from-slate-50 via-white to-indigo-50/60 border-slate-200/80">
        <div class="flex items-center space-x-2 min-w-0">
          <div id="encouragementIconBox" class="w-6 h-6 rounded-md bg-slate-100 text-slate-700 flex items-center justify-center text-xs shrink-0">
            <i id="encouragementIcon" class="ph ph-plant font-bold"></i>
          </div>
          <div class="min-w-0 flex items-center space-x-1.5">
            <span id="encouragementLevelBadge" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 shrink-0">시작</span>
            <span id="encouragementMessage" class="text-[11px] font-semibold text-slate-800 truncate">시작이 반이에요! 첫 실천을 해볼까요? 🌱</span>
          </div>
        </div>
        <span id="encouragementScoreBadge" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-500 font-mono shrink-0">0/49</span>
      </div>

      <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
        <div class="bg-slate-50/90 border-b border-slate-200/80 px-2 py-1.5 flex items-center text-center">
          <div class="w-[72px] sm:w-28 text-left pl-1 text-[10px] sm:text-xs font-bold text-slate-500 shrink-0">루틴</div>
          <div class="flex-1 grid grid-cols-7 gap-1 text-center" id="weekDaysHeaderGrid"></div>
          <div class="w-10 sm:w-12 text-right pr-1 text-[9px] sm:text-xs font-bold text-slate-400 shrink-0">실천</div>
        </div>
        <div id="routinesListContainer" class="divide-y divide-slate-100 text-xs"></div>
        <div id="emptyRoutineState" class="hidden p-6 text-center text-xs text-slate-400">등록된 루틴이 없습니다.</div>
      </div>

      <div class="bg-white p-3 rounded-xl border border-slate-200/80">
        <div class="flex items-center justify-between mb-1.5">
          <h3 class="font-bold text-slate-800 text-xs flex items-center"><i class="ph ph-chart-bar text-indigo-600 mr-1 text-sm font-bold"></i> 요일별 실천 추이</h3>
          <span class="text-[9px] text-slate-400 font-mono">주간 패턴</span>
        </div>
        <div class="h-28 sm:h-36 w-full">
          <canvas id="weeklyDailyChart"></canvas>
        </div>
      </div>
    </div>

    <div id="spreadsheetSection" class="hidden space-y-2.5">
      <div class="bg-white p-3 rounded-xl border border-slate-200/80 flex items-center justify-between">
        <div>
          <h2 class="text-xs sm:text-sm font-bold text-slate-900">📊 누적 데이터 기록표</h2>
          <p class="text-[10px] text-slate-400">매일 자동으로 저장되는 상세 내역입니다.</p>
        </div>
        <div class="flex items-center space-x-1.5">
          <select id="sheetMonthFilter" class="px-2 py-1 text-[11px] font-medium rounded-lg border border-slate-300 bg-white"></select>
          <button id="exportCsvFromSheetBtn" class="px-2.5 py-1 text-[11px] font-bold text-emerald-700 bg-emerald-50 rounded-lg">CSV</button>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
        <div class="overflow-x-auto max-h-[420px]">
          <table class="w-full text-left border-collapse text-[11px]">
            <thead class="sticky top-0 bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <tr>
                <th class="py-2 px-2.5">날짜</th>
                <th class="py-2 px-1">요일</th>
                <th class="py-2 px-2">루틴명</th>
                <th class="py-2 px-1 text-center">실천</th>
              </tr>
            </thead>
            <tbody id="sheetTableBody" class="divide-y divide-slate-100 font-mono text-[10px]"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <div id="routineModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white w-full max-w-xs mx-4 rounded-2xl shadow-xl border border-slate-100 overflow-hidden p-4 space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-sm" id="modalTitle">루틴 설정</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1"><i class="ph ph-x text-lg"></i></button>
      </div>
      <form id="routineForm" class="space-y-3">
        <input type="hidden" id="routineId">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">루틴 이름 *</label>
          <input type="text" id="routineName" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">메모 (선택)</label>
          <input type="text" id="routineNote" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300">
        </div>
        <div class="pt-2 flex items-center justify-between">
          <button type="button" id="modalDeleteBtn" class="hidden px-2.5 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-lg">
            <i class="ph ph-trash mr-1"></i>삭제
          </button>
          <div class="flex items-center space-x-1.5 ml-auto">
            <button type="button" id="cancelModalBtn" class="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 rounded-lg">취소</button>
            <button type="submit" class="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 rounded-lg">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toastNotification" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg flex items-center space-x-2 text-xs transition-all duration-300 transform translate-y-16 opacity-0 pointer-events-none whitespace-nowrap">
    <i class="ph ph-check-circle text-emerald-400 text-base"></i>
    <span id="toastMessage">완료되었습니다.</span>
  </div>

  <script>
    const DEFAULT_ROUTINES = [
      { id: '1', name: '블로그', note: '포스팅 & 생각 정리' },
      { id: '2', name: '이슬산책', note: '상쾌한 바깥 산책' },
      { id: '3', name: '경제신문', note: '주요 시황 헤드라인' },
      { id: '4', name: '독서', note: '마음의 양식 채우기' },
      { id: '5', name: '순환운동', note: '전신 서킷 트레이닝' },
      { id: '6', name: 'L자다리', note: '취침 전 다리 피로 풀기' },
      { id: '7', name: '아침스트레칭', note: '기상 직후 몸 깨우기' }
    ];

    let routines = JSON.parse(localStorage.getItem('moamaru_routines_v3') || 'null') || DEFAULT_ROUTINES;
    let logs = JSON.parse(localStorage.getItem('moamaru_logs_v3') || '{}');
    let currentMonday = getMonday(new Date());
    let activeTab = 'weekly';
    let dailyChart = null;

    function saveData() {
      localStorage.setItem('moamaru_routines_v3', JSON.stringify(routines));
      localStorage.setItem('moamaru_logs_v3', JSON.stringify(logs));
    }

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function addDays(d, n) {
      const res = new Date(d);
      res.setDate(res.getDate() + n);
      return res;
    }

    function formatDate(d) {
      return d.toISOString().split('T')[0];
    }

    function getWeekDays(monday) {
      return Array.from({length: 7}, (_, i) => addDays(monday, i));
    }

    function renderWeekHeader() {
      const weekDays = getWeekDays(currentMonday);
      const start = weekDays[0];
      const end = weekDays[6];
      document.getElementById('currentMonthBadge').innerText = `${start.getFullYear()}.${String(start.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('weekRangeDisplay').innerText = `${start.getMonth() + 1}.${start.getDate()}(월) - ${end.getMonth() + 1}.${end.getDate()}(일)`;

      const dayNames = ['월', '화', '수', '목', '금', '토', '일'];
      const todayStr = formatDate(new Date());
      const headerGrid = document.getElementById('weekDaysHeaderGrid');
      headerGrid.innerHTML = '';

      weekDays.forEach((d, idx) => {
        const dStr = formatDate(d);
        const isToday = dStr === todayStr;
        let color = idx === 5 ? 'text-blue-500' : (idx === 6 ? 'text-rose-500' : 'text-slate-600');
        const col = document.createElement('div');
        col.className = `flex flex-col items-center justify-center py-0.5 rounded ${isToday ? 'bg-indigo-50 font-bold' : ''}`;
        col.innerHTML = `<span class="text-[9px] ${color} font-bold leading-none">${dayNames[idx]}</span><span class="text-[9px] mt-0.5 ${isToday ? 'text-indigo-700 font-extrabold' : 'text-slate-400'}">${d.getDate()}</span>`;
        headerGrid.appendChild(col);
      });
    }

    function renderRoutines() {
      renderWeekHeader();
      const container = document.getElementById('routinesListContainer');
      container.innerHTML = '';
      const weekDays = getWeekDays(currentMonday);
      const todayStr = formatDate(new Date());
      let totalDone = 0;

      routines.forEach(r => {
        const row = document.createElement('div');
        row.className = 'flex items-center px-2 py-1.5 hover:bg-slate-50/80';
        let rDone = 0;
        let checksHtml = '';

        weekDays.forEach((d, idx) => {
          const dStr = formatDate(d);
          const isDone = logs[dStr] && logs[dStr][r.id];
          if (isDone) rDone++;
          const isToday = dStr === todayStr;
          const borderCls = idx === 5 ? 'border-blue-100' : (idx === 6 ? 'border-rose-100' : 'border-slate-200');

          checksHtml += `
            <div class="flex items-center justify-center">
              <button type="button" data-rid="${r.id}" data-date="${dStr}" class="routine-check-btn day-check-btn touch-bounce rounded-lg border flex items-center justify-center ${isDone ? 'bg-indigo-600 border-indigo-600 text-white' : `bg-white ${borderCls} text-transparent`} ${isToday && !isDone ? 'ring-2 ring-indigo-400 border-indigo-400' : ''}">
                <i class="ph ph-check text-xs font-bold ${isDone ? 'opacity-100' : 'opacity-0'}"></i>
              </button>
            </div>
          `;
        });

        totalDone += rDone;
        row.innerHTML = `
          <div class="w-[72px] sm:w-28 pr-1 shrink-0 edit-btn cursor-pointer" data-id="${r.id}">
            <div class="font-bold text-slate-800 text-[11px] sm:text-xs truncate">${r.name}</div>
            <div class="text-[8px] sm:text-[10px] text-slate-400 truncate mt-0.5">${r.note || '터치 수정'}</div>
          </div>
          <div class="flex-1 grid grid-cols-7 gap-1 items-center justify-items-center">${checksHtml}</div>
          <div class="w-10 sm:w-12 text-right pl-0.5 shrink-0 font-mono text-[10px] sm:text-xs font-bold ${rDone === 7 ? 'text-emerald-600' : (rDone >= 4 ? 'text-indigo-600' : 'text-slate-400')}">
            ${rDone}<span class="text-[8px] font-normal text-slate-300">/7</span>
          </div>
        `;
        container.appendChild(row);
      });

      const totalTarget = routines.length * 7;
      const rate = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;
      document.getElementById('weeklyRateStat').innerText = `${rate}%`;
      document.getElementById('weeklyFractionStat').innerText = `(${totalDone}/${totalTarget})`;
      document.getElementById('encouragementScoreBadge').innerText = `${totalDone}/${totalTarget}`;
      updateChart();
      if (activeTab === 'sheet') renderSpreadsheetView();
    }

    function updateChart() {
      const cvs = document.getElementById('weeklyDailyChart');
      if (!cvs || typeof Chart === 'undefined') return;
      const weekDays = getWeekDays(currentMonday);
      const counts = weekDays.map(d => {
        const dStr = formatDate(d);
        return logs[dStr] ? routines.filter(r => logs[dStr][r.id]).length : 0;
      });

      if (dailyChart) {
        dailyChart.data.datasets[0].data = counts;
        dailyChart.update();
      } else {
        dailyChart = new Chart(cvs.getContext('2d'), {
          type: 'bar',
          data: {
            labels: ['월', '화', '수', '목', '금', '토', '일'],
            datasets: [{ data: counts, backgroundColor: 'rgba(99, 102, 241, 0.85)', borderRadius: 6 }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }
    }

    function renderSpreadsheetView() {
      const tbody = document.getElementById('sheetTableBody');
      const monthFilter = document.getElementById('sheetMonthFilter');
      const dates = Object.keys(logs).sort().reverse();
      tbody.innerHTML = '';
      const curYM = `${currentMonday.getFullYear()}-${String(currentMonday.getMonth()+1).padStart(2,'0')}`;
      const yms = Array.from(new Set([curYM, ...dates.map(d => d.slice(0, 7))]));

      monthFilter.innerHTML = yms.map(ym => `<option value="${ym}">${ym}</option>`).join('');
      const selected = monthFilter.value || curYM;
      const filtered = dates.filter(d => d.startsWith(selected));
      const dayKOR = ['일', '월', '화', '수', '목', '금', '토'];

      filtered.forEach(dStr => {
        const dName = dayKOR[new Date(dStr + 'T00:00:00').getDay()];
        routines.forEach(r => {
          const isDone = logs[dStr] && logs[dStr][r.id];
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="py-1 px-2 font-sans">${dStr.slice(5)}</td>
            <td class="py-1 px-1 font-sans text-slate-400">${dName}</td>
            <td class="py-1 px-2 font-sans font-medium text-slate-800">${r.name}</td>
            <td class="py-1 px-1 text-center font-sans font-bold ${isDone ? 'text-emerald-600' : 'text-slate-300'}">${isDone ? '✓' : '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    document.getElementById('routinesListContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('.routine-check-btn');
      if (btn) {
        const rid = btn.dataset.rid;
        const dStr = btn.dataset.date;
        if (!logs[dStr]) logs[dStr] = {};
        logs[dStr][rid] = !logs[dStr][rid];
        saveData();
        renderRoutines();
        return;
      }
      const edit = e.target.closest('.edit-btn');
      if (edit) openModal(edit.dataset.id);
    });

    const modal = document.getElementById('routineModal');
    function openModal(id = null) {
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
      const delBtn = document.getElementById('modalDeleteBtn');
      if (id) {
        const r = routines.find(x => x.id === id);
        document.getElementById('routineId').value = r.id;
        document.getElementById('routineName').value = r.name;
        document.getElementById('routineNote').value = r.note || '';
        delBtn.classList.remove('hidden');
      } else {
        document.getElementById('routineForm').reset();
        document.getElementById('routineId').value = '';
        delBtn.classList.add('hidden');
      }
    }
    function closeModal() {
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    document.getElementById('routineForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('routineId').value;
      const name = document.getElementById('routineName').value.trim();
      const note = document.getElementById('routineNote').value.trim();
      if (!name) return;
      if (id) {
        const idx = routines.findIndex(r => r.id === id);
        if (idx !== -1) routines[idx] = { ...routines[idx], name, note };
      } else {
        routines.push({ id: Date.now().toString(), name, note });
      }
      saveData();
      renderRoutines();
      closeModal();
    });

    document.getElementById('modalDeleteBtn').addEventListener('click', () => {
      const id = document.getElementById('routineId').value;
      if (id && confirm('이 루틴을 삭제하시겠습니까?')) {
        routines = routines.filter(r => r.id !== id);
        saveData();
        renderRoutines();
        closeModal();
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('openAddRoutineModalBtn').addEventListener('click', () => openModal());
    document.getElementById('prevWeekBtn').addEventListener('click', () => { currentMonday = addDays(currentMonday, -7); renderRoutines(); });
    document.getElementById('nextWeekBtn').addEventListener('click', () => { currentMonday = addDays(currentMonday, 7); renderRoutines(); });
    document.getElementById('todayWeekBtn').addEventListener('click', () => { currentMonday = getMonday(new Date()); renderRoutines(); });

    document.getElementById('tabWeeklyBtn').addEventListener('click', () => {
      activeTab = 'weekly';
      document.getElementById('weeklyTrackerSection').classList.remove('hidden');
      document.getElementById('spreadsheetSection').classList.add('hidden');
    });
    document.getElementById('tabSheetBtn').addEventListener('click', () => {
      activeTab = 'sheet';
      document.getElementById('weeklyTrackerSection').classList.add('hidden');
      document.getElementById('spreadsheetSection').classList.remove('hidden');
      renderSpreadsheetView();
    });

    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
    document.getElementById('exportCsvFromSheetBtn').addEventListener('click', exportCSV);

    function exportCSV() {
      let csv = '\uFEFF날짜,요일,루틴명,달성여부,메모\n';
      const dates = Object.keys(logs).sort();
      const dayKOR = ['일', '월', '화', '수', '목', '금', '토'];
      dates.forEach(d => {
        const dName = dayKOR[new Date(d + 'T00:00:00').getDay()];
        routines.forEach(r => {
          csv += `"${d}","${dName}","${r.name}","${logs[d] && logs[d][r.id] ? '완료' : '미완료'}","${r.note || ''}"\n`;
        });
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `모아마루_기록_${formatDate(new Date())}.csv`;
      a.click();
    }

    renderRoutines();
  </script>
</body>
</html>
